services:
  database:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transaction}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "3307:3306"
    volumes:
      - transaction_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD","mysqladmin", "ping", "-h", "localhost","-u${MYSQL_USER:-app}", "-p${MYSQL_PASSWORD:-app}" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  transaction_data: